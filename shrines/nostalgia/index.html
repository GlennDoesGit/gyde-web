    <!-- very cool dithering filter -->
    <svg image-rendering="optimizeSpeed" width="0" height="0">
        <filter id="dither" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
            <!-- saturate or desaturate before filtering -->
            <feColorMatrix type="saturate" values="0.85" in="SourceGraphic" result="soft" />

            <feImage
                width="4"
                height="4"
                xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAASElEQVR42gXBgQAAIAxFwW8QwhBCCCGEIYQQQgghhBBCCEMYwutOkphzYmbsvdG9l9YaEYG7o1or5xxKKay1UGYyxuC9R++dD7yGJkTj6F0HAAAAAElFTkSuQmCC"
            />
            <feTile result="tile" />

            <feComposite operator="arithmetic" k1="0" k2="0.75" k3="0.25" k4="0" in="soft" in2="tile" />

            <feComponentTransfer>
                <feFuncR type="discrete" tableValues="0 0.333 0.667 1" />
                <feFuncG type="discrete" tableValues="0 0.333 0.667 1" />
                <feFuncB type="discrete" tableValues="0 0.333 0.667 1" />
            </feComponentTransfer>
        </filter>
